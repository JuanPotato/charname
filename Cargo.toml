[package]
name = "charname"
version = "1.18.0"
edition = "2024"
authors = ["Hasan Ibraheem <hasan@h-i.dev>"]
license = "MPL-2.0"
description = "Incredibly simple library that just gives you the Unicode name for a character."
repository = "https://github.com/JuanPotato/charname"

[dependencies]
phf = "0.14"

[build-dependencies]
phf_codegen = "0.14"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "bench_get_name"
harness = false
